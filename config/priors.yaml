priors:
  # equilibrium climate sensitivity
  ECS_CEN: 3.0  # default, can be changed in CLI

  # ocean transport coefficient
  G_CEN: 0.7
  G_STD: None

  # surface heat capacity
  C1_CEN: 8.0
  C1_STD: None

  # deep ocean heat capacity
  C2_CEN: 100.0
  C2_STD: None

  # forcing efficacy of co2
  F1_CO2_CEN: 4.58
  F1_CO2_STD: 0.519  # from Zelinka et al. (2020)

  # climate feedback (set by ECS in dataclass initialization)
  L_CEN: None
  L_STD: None

  # pattern effect parameter
  EPS_CEN: 1.58
  EPS_STD: 0.128  # from cummins et al. (2020)

  # error factor for making other prior stds
  PRIOR_STD_FACTOR: 0.3

  # pattern scaling for global temperautre in regions 1, 2, and 3
  ALPHA_R1_CEN: 2.0
  ALPHA_R1_STD: 0.2

  ALPHA_R2_CEN: 1.3
  ALPHA_R2_STD: 0.13

  ALPHA_R3_CEN: 1.5
  ALPHA_R3_STD: 0.15

  # pattern scaling for geoengineering in regions 1, 2, and 3
  BETA_R1_CEN: 0.018
  BETA_R1_STD: 0.0055

  BETA_R2_CEN: -0.018
  BETA_R2_STD: 0.0055

  BETA_R3_CEN: 0.0153
  BETA_R3_STD: 0.0055

  # set a list of variables that need the PRIOR_STD_FACTOR to set their prior variances
  factor_vars:
    - [L_CEN, L_STD]
    - [G_CEN, G_STD]
    - [C1_CEN, C1_STD]
    - [C2_CEN, C2_STD]

  # add warm start dummy vars (will be overridden by warm start module)
  T1_CEN: None
  T1_STD: None

  T2_CEN: None
  T2_STD: None

  Q_CEN: None
  Q_STD: None

  T_R1_CEN: None
  T_R1_STD: None

  T_R2_CEN: None
  T_R2_STD: None

  T_R3_CEN: None
  T_R3_STD: None