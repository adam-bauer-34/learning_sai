global:
  # equilibrium climate sensitivity
  ECS_CEN: 3.0  # default, can be changed in CLI

  # ocean transport coefficient
  # central estimate and standard deviation set to match IPCC AR6 likely range for 
  # TCR (1.8, likely range 1.4-2.2)
  G_CEN: 0.62
  G_STD: 0.26

  # surface heat capacity
  C1_CEN: 8.0
  C1_STD: None

  # deep ocean heat capacity
  C2_CEN: 100.0
  C2_STD: None

  # forcing efficacy of co2
  # calibrated to match RFMIP central estimate: F2x = 3.99 +/- 0.19 W / m^2
  F1_CO2_CEN: 5.756353213
  F1_CO2_STD: 0.2741120578

  # climate feedback (set by ECS in dataclass initialization)
  # standard deviation from matching ECS distribution to Sherwood et al (2020)
  L_CEN: None
  L_STD: 0.31

  # pattern effect parameter
  EPS_CEN: 1.58
  EPS_STD: 0.128  # from Cummins et al. (2020)

  # error factor for making other prior stds
  PRIOR_STD_FACTOR: 0.3

  # set a list of variables that need the PRIOR_STD_FACTOR to set their prior variances
  factor_vars:
    - [C1_CEN, C1_STD]
    - [C2_CEN, C2_STD]

  # add warm start dummy vars (will be overridden by warm start module)
  T1_CEN: 0.0
  T1_STD: None  # same size as internal variability, set on init of dc

  T2_CEN: 0.0
  T2_STD: None  # same size as internal variability, set on init of dc

  Q_CEN: 0.0
  Q_STD: None  # set on import T1_STD * (C1 + C2)

two_region:
  ALPHA_CEN: [1.6, 1.3]  # pattern scaling
  BETA_CEN: [-0.01693167, 0.01693167]  # sai adjustment
  T_REG_CEN: [0.0, 0.0]  # regional temperature initial conditions

  ALPHA_STD: [0.2816, 0.2288]
  BETA_STD: [0.00957743, 0.00957743]
  T_REG_STD: [None, None]

three_region:
  ALPHA_CEN: [1.6, 1.3, 1.275]  # pattern scaling
  BETA_CEN: [-0.01734648, 0.01734648, -0.01073647]  # sai adjustment
  T_REG_CEN: [0.0, 0.0, 0.0]  # regional temperature initial conditions

  ALPHA_STD: [0.32, 0.26, 0.255]
  BETA_STD: [0.01335151, 0.01335151, 0.01335151]
  T_REG_STD: [None, None, None]